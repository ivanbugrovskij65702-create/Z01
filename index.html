const MAX_PTS = 4500;
const STEP_PTS = MAX_PTS / 19; // ~236.84 балла на каждую ступень, чтобы ровно на 4 500 открывалась 20-я ступень

function calc(v){
 const n=k=>Math.max(0, +v[k]||0);

 // Блок 1 (База) + Блок 2 (Экстремальная калистеника)
 const basePts = n("pull")*2 + n("push")*1 + n("sq")*1;
 const extCalPts = n("mup")*3 + n("opull")*5 + n("opush")*3 + n("odip")*8 + n("fl")*3 + n("hor")*4 + n("pl")*7 + n("hspu")*3 + n("hs")*1;
 const cs = basePts + extCalPts;

 // Блок 3 · Зал и вес (кг)
 const gs = n("bench")*2 + n("squat")*1 + n("dead")*1 + n("wpull")*2 + n("wdip")*2;

 // Блок 4 · Сухожилия и статодинамика
 const ts = n("finger")*1.5 + n("f2")*3 + n("fthumb")*3 + n("fpull1")*10 + n("ohold90")*1;

 // Общая сумма баллов со всех блоков (максимум 4 500 баллов = 20 ступень)
 const totalPts = Math.min(MAX_PTS, Math.round((cs + gs + ts)*10)/10);

 // Перевод баллов в ступень (от 1 до 20 равномерно, где 4 500 = 20 ступень)
 const toStep = pts => pts >= MAX_PTS ? 20 : Math.max(1, Math.min(19, 1 + Math.floor(pts / STEP_PTS)));

 const lg = toStep(totalPts);
 const b = { cal: toStep(cs), gym: toStep(gs), tend: toStep(ts) };

 const branchScores = { cal: cs, gym: gs, tend: ts };
 let top = Object.keys(branchScores).sort((x,y)=>branchScores[y]-branchScores[x])[0];
 let cls = {cal:"Адепт Калистеники",gym:"Титан Сверхвесов",tend:"Мастер Сухожилий"}[top];
 let dir = top;

 if(cs >= 1125 && gs >= 1125){
  cls = "Гибрид";
  dir = "hyb";
 }
 return { b, lg, cls, dir, pts: totalPts };
}

 function noiseTex(w,h,bg,c1,c2,sc,str){
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;
  const x=cv.getContext('2d');x.fillStyle=bg;x.fillRect(0,0,w,h);

  }
  const t=new THREE.CanvasTexture(cv);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;
 }

  va=.77+.15*k;
 }
 vigEl.style.background=`radial-gradient(circle at 50% 50%, rgba(0,0,0,0) 42%, rgba(${vr},${vg},${vb},${(va*.55).toFixed(2)}) 76%, rgba(${vr},${vg},${vb},${va.toFixed(2)}) 100%)`;
 upd(t); snowUpd(t);
 els.forEach(o=>{v3.copy(o.p).project(cam);const dist=cam.position.distanceTo(o.p);
  if(v3.z>1||dist>130||dist<2){o.e.style.display="none";return}
  const x=(v3.x+1)/2*innerWidth,y=(1-v3.y)/2*innerHeight,k=Math.max(.45,Math.min(1.6,40/dist));
  o.e.style.display="";o.e.style.transform="translate("+x+"px,"+y+"px) translate(-50%,-50%) scale("+k+")"});
 R.render(S,cam);requestAnimationFrame(frame);
}

function radar(a){
 const W=260,H=215,dpr=Math.min(window.devicePixelRatio||1,3),c=document.createElement("canvas");
 c.width=W*dpr;c.height=H*dpr;
 c.style.cssText="position:static;width:"+W+"px;height:"+H+"px;display:block;margin:6px auto 0";
 const x=c.getContext("2d");x.scale(dpr,dpr);
 const cx=W/2,cy=112,R0=64,pt=(i,v)=>[cx+Math.sin(i*2.094395)*R0*v,cy-Math.cos(i*2.094395)*R0*v];
 x.strokeStyle="rgba(255,255,255,0.22)";x.lineWidth=1;
 [.33,.66,1].forEach(v=>{x.beginPath();[0,1,2].forEach(i=>{const p=pt(i,v);i?x.lineTo(...p):x.moveTo(...p)});x.closePath();x.stroke()});
 [0,1,2].forEach(i=>{const p=pt(i,1);x.beginPath();x.moveTo(cx,cy);x.lineTo(...p);x.stroke()});
 const vals=[a.r.b.cal,a.r.b.gym,a.r.b.tend];
 x.beginPath();vals.forEach((v,i)=>{const p=pt(i,Math.max(0.06,v/20));i?x.lineTo(...p):x.moveTo(...p)});
 x.closePath();x.fillStyle="rgba(255,157,46,0.55)";x.fill();x.strokeStyle="#ff9d2e";x.lineWidth=2.2;x.stroke();
 vals.forEach((v,i)=>{const p=pt(i,Math.max(0.06,v/20));x.beginPath();x.arc(p[0],p[1],3.5,0,Math.PI*2);x.fillStyle="#ff9d2e";x.fill()});
 x.fillStyle="#fff";x.font="700 12.5px system-ui, sans-serif";x.textAlign="center";
 const p0=pt(0,1);x.fillText("Калистеника "+vals[0],p0[0],p0[1]-12);
 const p1=pt(1,1);x.fillText("Зал "+vals[1],p1[0]+26,p1[1]+16);
 const p2=pt(2,1);x.fillText("Сухожилия "+vals[2],p2[0]-28,p2[1]+14);
 x.font="600 11.5px system-ui, sans-serif";x.fillStyle="rgba(255,255,255,0.85)";
 x.fillText("кости",p2[0]-28,p2[1]+29);
 return c;
}
